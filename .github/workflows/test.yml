name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Rust tools
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Load generator tests
        run: cargo test --locked
      - name: Runner tests
        run: |
          cargo build --locked
          TWELVE_DOLLAR_BENCHMARK_BIN=target/debug/twelve-dollar-benchmark python3 tests/test_runner.py
          TWELVE_DOLLAR_BENCHMARK_BIN=target/debug/twelve-dollar-benchmark python3 tests/test_metrics.py
