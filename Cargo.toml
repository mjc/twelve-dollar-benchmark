[package]
name = "twelve-dollar-benchmark"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "twelve-dollar-benchmark"

[[bin]]
name = "twelve-dollar-observer"
path = "src/observer.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy"] }
libc = "0.2"
lexopt = "0.3.2"
num-traits = "0.2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
tower = "0.5"

[patch.crates-io]
hyper = { path = "vendor/hyper" }
hyper-util = { path = "vendor/hyper-util" }
