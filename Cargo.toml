[package]
name = "twelve-dollar-benchmark"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "twelve-dollar-benchmark"

[[bin]]
name = "twelve-dollar-observer"
path = "src/observer.rs"

[dependencies]
bytes = "1"
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "http1"] }
hyper = { version = "1", features = ["client", "http1"] }
http-body-util = "0.1"
http = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
libc = "0.2"
lexopt = "0.3.2"
num-traits = "0.2"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
url = "2.5"

[dev-dependencies]
flate2 = "1"

[patch.crates-io]
hyper = { git = "https://github.com/mjc/hyper.git", rev = "903ce8f3c54704c148c0967e4374c69707906dc8" }
hyper-util = { git = "https://github.com/mjc/hyper-util.git", rev = "df185d6b535ca66198ebf8175e14b1ea4db75277" }
tokio = { git = "https://github.com/mjc/tokio.git", rev = "30fa5746845ea20c8908134ee72ac6f43ecc76ac" }
